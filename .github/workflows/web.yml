name: Build Web

on:
  push:
    branches: ['test', 'main', 'vue-pc']

jobs:
  check-commit-message:
    name: Check commit message should release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check_message.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Check commit message
        id: check_message
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            return /chore:\s*release\s*v\d+\.\d+\.\d+/.test(context.payload.head_commit.message);
  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: check-commit-message
    if: ${{ needs.check-commit-message.outputs.should_release == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: ${{github.ref_name == 'test' && 'pnpm run build:test' || 'pnpm run build' }}

      - name: Deploy To Server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{github.ref_name == 'main' && secrets.REMOTE_TARGET || secrets.REMOTE_TEST_TARGET }}
          SOURCE: 'dist/'
          ARGS: '-rlgoDzvc -i'
          SCRIPT_BEFORE: |
            whoami
            ls -al
          SCRIPT_AFTER: |
            whoami
            ls -al
            echo $RSYNC_STDOUT
